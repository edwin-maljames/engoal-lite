services:
  postgres-test:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: engoal_lite_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: engoal_lite_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engoal_lite_test -d engoal_lite_test"]
      interval: 5s
      timeout: 5s
      retries: 10
